steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3
    with:
      accept-android-sdk-licenses: true
      packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Check Android SDK
    run: |
      echo "ANDROID_HOME=$ANDROID_HOME"
      sdkmanager --list_installed

  - name: Inspect project files
    run: |
      echo "CURRENT DIRECTORY"
      pwd

      echo "APP DIRECTORY"
      ls -la app

      echo "SOURCE DIRECTORY"
      ls -la app/src

      echo "MAIN DIRECTORY"
      ls -la app/src/main

      echo "EXACT MANIFEST FILE CHECK"
      if [ -f app/src/main/AndroidManifest.xml ]; then
        echo "SUCCESS: AndroidManifest.xml exists"
      else
        echo "ERROR: AndroidManifest.xml is missing"
        find app -type f
        exit 1
      fi

      echo "MANIFEST CONTENTS"
      cat app/src/main/AndroidManifest.xml

      echo "GIT TRACKING"
      git ls-files app/src/main

  - name: Build APK
    run: gradle --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: CalcMaster-Pro-APK
      path: app/build/outputs/apk/debug/app-debug.apk